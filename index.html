<!DOCTYPE html>
<html>
<head>
    <title>D3 Project Starter Template</title>
    <meta charset="UTF-8">
    <link rel="icon" href="data:;base64,iVBORwOKGO=" />
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abel&family=Goudy+Bookletter+1911&family=Inter&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:wght@300&display=swap" rel="stylesheet">
</head>
<body>    
    <!-- Add HTML content, SVG drawing area, ... -->
    <div class="container">
        <div id="header">
            <h1>School Book Bans in the United States</h1>   
        </div> 
        <div style="display:flex;flex-direction:row">
        <div id="vis-sunburst">
            <div id="tooltip-structure"></div>
            <div id="sortSelector" style="float: right">
                <label for="sort">Sort by:</label>
                <select name="sort" class="sort">
                    <option value="count">Number of bans</option>
                    <option value="alphabet">Alphabet</option>
                </select>
            </div>
            <div id="tooltip-sun"></div>
        </div>
        <div id="date-map" style="margin-left: 40px; text-align:center">
            <div id="date-container">
                <h3 id="selectedDate" class="header">Selected Date: </h3>
                <input class="slidecontainer" type="range" min="0" max="36" value="50" class="slider" id="date" list="markersLimited"/>
                <datalist id="markersLimited">
                    <option value="0" label = "All Years"></option>
                    <option value="1" label = "July 2021"></option>
                    <option value="2"></option>
                    <option value="3"></option>
                    <option value="4"></option>
                    <option value="5"></option>

                    <option value="6"></option>
                    <option value="7" label = "2022"></option>
                    <option value="8"></option>
                    <option value="9"></option>
                    <option value="10"></option>
                    <option value="11"></option>
                    <option value="12"></option>
                    <option value="13"></option>
                    <option value="14"></option>
                    <option value="15"></option>
                    <option value="16"></option>
                    <option value="17"></option>

                    <option value="18"></option>
                    <option value="19" label = "2023"></option>
                    <option value="20"></option>
                    <option value="21"></option>
                    <option value="22"></option>
                    <option value="23"></option>
                    <option value="24"></option>
                    <option value="25"></option>
                    <option value="26"></option>
                    <option value="27"></option>
                    <option value="28"></option>
                    <option value="29"></option>

                    <option value="30"></option>
                    <option value="31" label = "2024"></option>
                    <option value="32"></option>
                    <option value="33"></option>
                    <option value="34"></option>
                    <option value="35"></option>
                    <option value="36" label = "June 2024"></option>
                </datalist>
            </div>
            <div id="mercator" style="text-align:center"></div>
            <div id="footer">WARNING: Some books from the original PEN dataset were omitted due to lack of genre data (about 400). Some genre classifications and descriptions might be incorrect, however, state, district, and books should be correct.</div>
        </div>
        </div>                                                          
    </div>

    <div id="tooltip"></div>
    
    <!-- D3 bundle -->
    <script src="js/d3.v6.min.js"></script>
    <!-- Script for d3-legend -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-legend/2.25.6/d3-legend.min.js"></script>

    <!-- Our JS code -->
    <script src="js/topojson.v3.js"></script>
    <script src="js/choroplethMap.js"></script>
    <script src="js/sunburst.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
