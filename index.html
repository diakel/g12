<!DOCTYPE html>
<html>
<head>
    <title>D3 Project Starter Template</title>
    <meta charset="UTF-8">
    <link rel="icon" href="data:;base64,iVBORwOKGO=" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>    
    <!-- Add HTML content, SVG drawing area, ... -->
    <div class="container">
        <h1>Book bans in the United States</h1>    
        <div style="display:flex;flex-direction:row">
        <div id="vis-sunburst" style="float:left;margin:20px">
        </div>
        <div id="mercator" style="width:550px;text-align:center">
            <form>
                <p class="fallbackLabel">Select a Month to View</p>
                <div class="fallbackDatePicker">
                    <div>
                        <span>
                            <label for="month">Month:</label>
                            <select id="month" name="month"></select>
                        </span>
                        <span>
                            <label for="year">Year:</label>
                            <select id="year" name="year"></select>
                        </span>
                    </div>
                </div>
            </form>
        </div>
        </div>                                                           
    </div>

    <div id="tooltip"></div>
    
    <!-- D3 bundle -->
    <script src="js/d3.v6.min.js"></script>

    <!-- Our JS code -->
    <script src="js/topojson.v3.js"></script>
    <script src="js/choroplethMap.js"></script>
    <script src="js/sunburst.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
